<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modification FAQ - Agglomération de Lisieux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="page-container">
            <h1 class="main-title">Gestion des questions fréquentes</h1>
            
            <div class="data-container">
                <!-- Colonne des questions -->
                <div class="data-column">
                    <h2 class="column-title">Liste des questions</h2>
                    <div class="questionnaire-list" id="faq-list">
                        <!-- Les questions seront générées par JavaScript -->
                    </div>
                </div>
            </div>
            
            <!-- Boutons d'actions -->
            <div class="button-container">
                <button class="action-button btn-edit" id="btn-edit">Modifier</button>
                <button class="action-button btn-delete" id="btn-delete">Supprimer</button>
                <button class="action-button btn-add" id="btn-add">Ajouter une question</button>
                <button class="action-button btn-back" id="btn-back">Retour au menu</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="h-100 align-items-center">
            <p class="mb-1">~~| Copyright © |~~</p>
            <p class="mb-1 fw-bold">MUNOZ Paul</p>
            <p class="mb-0 text-muted">TD3 - SAE-4/5/6 - 2025</p>
        </div>
        <div>
            <h5 class="mb-3 border-bottom border-secondary pb-2">Contacts</h5>
            <ul class="list-unstyled mb-0">
                <li class="mb-1">fabienne.jort@unicaen.fr</li>
            </ul>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initFAQPage();
        });
    </script>
</body>
</html>
